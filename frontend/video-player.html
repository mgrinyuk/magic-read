<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Magic Read Video Player</title>
  <style>
    html,
    body,
    #player {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #160b2c;
    }

    body {
      position: fixed;
      inset: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("videoId") || "";
    const parentOrigin = params.get("parentOrigin") || "*";
    let player = null;
    let tick = null;

    function post(type, payload = {}) {
      window.parent.postMessage({ source: "magic-read-video-player", type, ...payload }, parentOrigin);
    }

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        videoId,
        playerVars: {
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin,
          widget_referrer: window.location.origin
        },
        events: {
          onReady: () => {
            post("ready", { duration: player.getDuration() || 0 });
            tick = setInterval(() => {
              if (!player || !player.getCurrentTime) return;
              post("time", {
                currentTime: player.getCurrentTime() || 0,
                duration: player.getDuration() || 0,
                state: player.getPlayerState ? player.getPlayerState() : -1
              });
            }, 250);
          },
          onStateChange: event => {
            post("state", {
              state: event.data,
              currentTime: player.getCurrentTime ? player.getCurrentTime() : 0,
              duration: player.getDuration ? player.getDuration() : 0
            });
          },
          onError: event => post("error", { code: event.data })
        }
      });
    };

    window.addEventListener("message", event => {
      if (!player) return;
      const msg = event.data || {};
      if (msg.source !== "magic-read-video-host") return;
      if (msg.type === "play") player.playVideo();
      if (msg.type === "pause") player.pauseVideo();
      if (msg.type === "seek") player.seekTo(Number(msg.seconds) || 0, true);
      if (msg.type === "rate") player.setPlaybackRate(Number(msg.rate) || 1);
    });

    window.addEventListener("pagehide", () => {
      if (tick) clearInterval(tick);
    });

    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  </script>
</body>
</html>
